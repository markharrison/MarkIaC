name: Delete Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to delete'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      sql_admin_login:
        description: 'Entra ID admin login name for SQL Server'
        required: true
        type: string
      sql_admin_object_id:
        description: 'Entra ID admin object ID for SQL Server'
        required: true
        type: string
      confirm_delete:
        description: 'Type DELETE to confirm deletion'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  delete:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Validate Confirmation
        run: |
          if [ "${{ inputs.confirm_delete }}" != "DELETE" ]; then
            echo "ERROR: You must type DELETE to confirm deletion"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Destroy
        working-directory: ./terraform
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ inputs.environment }}" \
            -var="sql_admin_login=${{ inputs.sql_admin_login }}" \
            -var="sql_admin_object_id=${{ inputs.sql_admin_object_id }}"

      - name: Deletion Summary
        run: |
          echo "## Deletion Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All resources have been successfully deleted." >> $GITHUB_STEP_SUMMARY
